<head>

 <meta property="og:type" content="website">
 <meta property="og:url" content="https://www.klarwerk.studio/pages/kontakt.html">
 <meta property="og:title" content="Projekt besprechen | Kontakt KLARWERK">
 <meta property="og:description" content="Projekt mit KLARWERK starten. Kurzes Briefing, Antwort innerhalb von 24 Stunden. Website, Shop, Security, Analytics, Marketing.">
 <meta property="og:image" content="https://www.klarwerk.studio/assets/icons/logo.svg">

</head>
<body data-root="../" data-page="contact">
<a class="skip" href="#main">Zum Inhalt</a>
<div id="chrome"></div>
<main id="main">

<section class="page-hero">
 <div class="wrap" style="max-width:720px">
 <p class="sec-k">Kontakt</p>
 <h1>Projekt besprechen</h1>
 <p class="lead">Kurzes Briefing reicht. Antwort innerhalb von 24 Stunden.</p>
 <form id="contact-form" class="card" style="margin-top:28px">
 <div>
 <label id="need-label">Was sollen wir bauen?</label>
 <div class="chips" role="group" aria-labelledby="need-label">
 <label class="chip"><input type="radio" name="need" value="Website"> Website</label>
 <label class="chip"><input type="radio" name="need" value="Shop"> Shop</label>
 <label class="chip"><input type="radio" name="need" value="Web-App"> Web-App</label>
 <label class="chip"><input type="radio" name="need" value="Security"> Security</label>
 <label class="chip"><input type="radio" name="need" value="Analytics"> Analytics</label>
 <label class="chip"><input type="radio" name="need" value="Marketing"> Marketing</label>
 <label class="chip"><input type="radio" name="need" value="Noch nicht sicher"> Noch nicht sicher</label>
 </div>
 </div>
 <div style="margin-top:16px">
 <label for="goal">Was ist Ihr Ziel?</label>
 <textarea id="goal" name="goal" required placeholder="z. B. neuer Auftritt, Tracking, Shop, Incident…"></textarea>
 </div>
 <div class="cards cards-2" style="margin-top:16px">
 <div><label for="name">Name</label><input id="name" required name="name" autocomplete="name"></div>
 <div><label for="email">E-Mail</label><input id="email" required type="email" name="email" autocomplete="email"></div>
 </div>
 <div style="margin-top:16px"><label for="company">Unternehmen</label><input id="company" name="company" autocomplete="organization"></div>
 <button class="btn btn-primary" type="submit" style="margin-top:20px">Projekt besprechen</button>
 </form>
 <p class="note">Oder direkt: <a href="mailto:main@klarwerk.studio"><strong>main@klarwerk.studio</strong></a></p>
 </div>
</section>

</main>
<footer id="site-footer"></footer>
<script src="../assets/js/i18n.js"></script><script src="../assets/js/studio.js"></script>

</body>
</html>
